services:
  app:
    build: .
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/prisma_hr
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in your environment or .env}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:8.0-noble
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (db.adminCommand('ping').ok !== 1) quit(1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
